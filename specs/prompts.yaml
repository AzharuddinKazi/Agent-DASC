# DS-STAR Prompts — verbatim from paper Appendices L and M (arxiv 2509.21825)
# Extensions marked with [EXTENSION] — not in paper, added for MySQL/HITL/on-prem support
# RTF escape sequences removed; \{ and \} rendered as { and }

# ─────────────────────────────────────────────
# APPENDIX L — BASE DS-STAR AGENTS
# ─────────────────────────────────────────────

# L.1 Analyzer agent
analyzer: |
  You are an expert data analysist.
  Generate a Python code that loads and describes the content of {filename}.
  # Requirement
  - The file can both unstructured or structured data.
  - If there are too many structured data, print out just few examples.
  - Print out essential informations. For example, print out all the column names.
  - The Python code should print out the content of {filename}.
  - The code should be a single-file Python program that is self-contained and can be
    executed as-is.
  - Your response should only contain a single code block.
  - Important: You should not include dummy contents since we will debug if error occurs.
  - Do not use try: and except: to prevent error. I will debug it later.

# [EXTENSION] MySQL-specific analyzer (used when source_type == 'mysql')
analyzer_mysql: |
  You are an expert data analyst.
  Generate a Python code that connects to a MySQL database and describes its schema.
  Use SQLAlchemy with the connection string from os.environ["MYSQL_URL"].
  Print out: all table names, column names and types for each table, row count estimates,
  and 3 sample rows per table.
  The Python code should print out all of this information clearly.
  The code should be a single-file Python program that is self-contained and can be
  executed as-is.
  Your response should only contain a single code block.
  Do not use try: and except: to prevent error. I will debug it later.

# L.2 Planner agent — initial step
# Note: data is passed as per-file pairs, not a single concatenated string
planner_init: |
  You are an expert data analysist.
  In order to answer factoid questions based on the given data, you have to first plan
  effectively.
  # Question
  {question}
  # Given data: {filenames}
  {filenames_and_summaries}
  # Your task
  - Suggest your very first step to answer the question above.
  - Your first step does not need to be sufficient to answer the question.
  - Just propose a very simple initial step, which can act as a good starting point to
    answer the question.
  - Your response should only contain an initial step.

# L.2 Planner agent — next step (after initialization)
planner_next: |
  You are an expert data analysist.
  In order to answer factoid questions based on the given data, you have to first plan
  effectively.
  Your task is to suggest next plan to do to answer the question.
  # Question
  {question}
  # Given data: {filenames}
  {filenames_and_summaries}
  # Current plans
  {plan}
  # Obtained results from the current plans:
  {result}
  # Your task
  - Suggest your next step to answer the question above.
  - Your next step does not need to be sufficient to answer the question, but if it
    requires only final simple last step you may suggest it.
  - Just propose a very simple next step, which can act as a good intermediate point to
    answer the question.
  - Of course your response can be a plan which could directly answer the question.
  - Your response should only contain an next step without any explanation.

# L.3 Coder agent — initial implementation
coder_init: |
  # Given data: {filenames}
  {filenames_and_summaries}
  # Plan
  {plan}
  # Your task
  - Implement the plan with the given data.
  - Your response should be a single markdown Python code (wrapped in ```).
  - There should be no additional headings or text in your response.

# L.3 Coder agent — next step implementation (cumulative)
coder_next: |
  You are an expert data analysist.
  Your task is to implement the next plan with the given data.
  # Given data: {filenames}
  {filenames_and_summaries}
  # Base code
  ```python
  {base_code}
  ```
  # Previous plans
  {plan}
  # Current plan to implement
  {current_plan}
  # Your task
  - Implement the current plan with the given data.
  - The implementation should be done based on the base code.
  - The base code is an implementation of the previous plans.
  - Your response should be a single markdown Python code (wrapped in ```).
  - There should be no additional headings or text in your response.

# L.4 Verifier agent
# NOTE: Paper does NOT pass {summaries} to the Verifier — only plan, code, result, question
verifier: |
  You are an expert data analysist.
  Your task is to check whether the current plan and its code implementation is enough to
  answer the question.
  # Plan
  {plan}
  # Code
  ```python
  {code}
  ```
  # Execution result of code
  {result}
  # Question
  {question}
  # Your task
  - Verify whether the current plan and its code implementation is enough to answer the
    question.
  - Your response should be one of 'Yes' or 'No'.
  - If it is enough to answer the question, please answer 'Yes'.
  - Otherwise, please answer 'No'.

# L.5 Router agent
router: |
  You are an expert data analysist.
  Since current plan is insufficient to answer the question, your task is to decide how to
  refine the plan to answer the question.
  # Question
  {question}
  # Given data: {filenames}
  {filenames_and_summaries}
  # Current plans
  {plan}
  # Obtained results from the current plans:
  {result}
  # Your task
  - If you think one of the steps of current plans is wrong, answer among the following
    options: Step 1, Step 2, ..., Step K.
  - If you think we should perform new NEXT step, answer as 'Add Step'.
  - Your response should only be Step 1 - Step K or Add Step.

# L.6 Finalyzer agent
# NOTE: Paper includes "All files/documents are in `data/` directory."
finalyzer: |
  You are an expert data analysist.
  You will answer factoid question by loading and referencing the files/documents listed
  below.
  You also have a reference code.
  Your task is to make solution code to print out the answer of the question following the
  given guideline.
  # Given data: {filenames}
  {filenames_and_summaries}
  # Reference code
  ```python
  {code}
  ```
  # Execution result of reference code
  {result}
  # Question
  {question}
  # Guidelines
  {guidelines}
  # Your task
  - Modify the solution code to print out answer to follow the given guidelines.
  - If the answer can be obtained from the execution result of the reference code, just
    generate a Python code that prints out the desired answer.
  - The code should be a single-file Python program that is self-contained and can be
    executed as-is.
  - Your response should only contain a single code block.
  - Do not include dummy contents since we will debug if error occurs.
  - Do not use try: and except: to prevent error. I will debug it later.
  - All files/documents are in `data/` directory.

# L.7 Debugger agent — Prompt 1: traceback summarizer
# Called first to clean up the raw error before passing to the repair prompts
debugger_summarize: |
  # Error report
  {bug}
  # Your task
  - Remove all unnecessary parts of the above error report.
  - We are now running {filename}.py. Do not remove where the error occurred.

# L.7 Debugger agent — Prompt 2: repair for Analyzer scripts
debugger_analyzer: |
  # Code with an error:
  ```python
  {code}
  ```
  # Error:
  {bug}
  # Your task
  - Please revise the code to fix the error.
  - Provide the improved, self-contained Python script again.
  - There should be no additional headings or text in your response.
  - Do not include dummy contents since we will debug if error occurs.
  - All files/documents are in `data/` directory.

# L.7 Debugger agent — Prompt 3: repair for Coder solution scripts
debugger_coder: |
  # Given data: {filenames}
  {filenames_and_summaries}
  # Code with an error:
  ```python
  {code}
  ```
  # Error:
  {bug}
  # Your task
  - Please revise the code to fix the error.
  - Provide the improved, self-contained Python script again.
  - Note that you only have {filenames} available.
  - There should be no additional headings or text in your response.
  - Do not include dummy contents since we will debug if error occurs.
  - All files/documents are in `data/` directory.


# ─────────────────────────────────────────────
# APPENDIX M — DS-STAR+ AGENTS
# ─────────────────────────────────────────────

# M.1 Sub-question generator — initial sub-questions
subquestion_generator_init: |
  You are an expert data analysist.
  Your task is to write a comprehensive data science report to the given question by using
  the files/documents listed below.
  In order to do this, you have to first suggest multiple data analysis questions that
  should be answered to write the report.
  # Given data: {filenames}
  {filenames_and_summaries}
  # Question
  {question}
  # Your task
  - Suggest multiple factoid data analysis questions that are required to write the report
    really well.
  - All the questions should be well-answered using the given data.
  - All questions should be answered independently.
  - Generate as much as you can.
  - Return in valid JSON format:
    Questions = {'question': str}
    Return: list[Questions]

# M.1 Sub-question generator — supplementary sub-questions for report refinement
subquestion_generator_refine: |
  You are an expert data analysist.
  Your task is to complement the given data science report of the given question.
  In order to do this, you have to suggest supplementary multiple data analysis questions
  that can strengthen to the report.
  # Given data: {filenames}
  {filenames_and_summaries}
  # Given data science report:
  {report}
  # Question
  {question}
  # Your task
  - Suggest multiple factoid data analysis questions that are required to complement the
    report.
  - All questions should contain new information that is not included in the report.
  - All the questions should be well-answered using the given data.
  - All questions should be answered independently.
  - Return in valid JSON format:
    Questions = {'question': str}
    Return: list[Questions]

# M.2 Writer agent — initial report generation
# Uses numbered citations: [1], [2], ... up to len(subquestions)
writer_init: |
  You are an expert data analysist.
  Your task is to write a **comprehensive data science report** to the given question by
  using the data and some relevant informations listed below.
  # Relevant informations:
  {subquestion_answer_pairs}
  # Question that you have to write a comprehensive data science report:
  {question}
  # Your task:
  - The report should be grounded to the given relevant informations.
  - For the citation, use the Sub-Question number as a citation number which is in
    1 - {num_subquestions}.
  - The data science report should be relevant to given question, should be comprehensive,
    and should be insightful.
  - The data science report should have nice structure, good readability, and should be
    professional.
  - Write a very comprehensive data science report to the given above question.

# M.2 Writer agent — report refinement
# Uses alphabet citations: [a], [b], ... for NEW supplementary sub-questions only
writer_refine: |
  You are an expert data analysist.
  Your task is to complement the given data science report of the given question by using
  the some relevant informations listed below.
  Relevant informations:
  {subquestion_answer_pairs}
  # Given data science report:
  {report}
  # Question that you have to write a comprehensive data science report:
  {question}
  # Your task:
  - Do not modify the given report a lot. Just try to add new information.
  - The report should be grounded to the given relevant informations.
  - Cite with alphabet. For the citation, use the Sub-Question number as a citation
    alphabet (e.g., cite with [a] for the Sub-Question 1).
  - The data science report should be relevant to given question, should be comprehensive,
    and should be insightful.
  - The data science report should have nice structure, good readability, and should be
    professional.
  - Complement the given data science report to the given above question.


# ─────────────────────────────────────────────
# TEMPLATE VARIABLE REFERENCE
# ─────────────────────────────────────────────
#
# {filenames}               — comma-separated list of all source identifiers
# {filenames_and_summaries} — rendered as:
#                               {filename #1}
#                               {summary #1}
#                               ...
#                               {filename #N}
#                               {summary #N}
# {question}                — user's natural language query
# {plan}                    — numbered list of all steps so far: "1. {Step 1}\n...\nk. {Step k}"
# {current_plan}            — the single new step to implement (coder_next only)
# {result}                  — printed stdout from most recent Docker execution
# {code}                    — current cumulative Python script
# {base_code}               — cumulative code before the current new step (coder_next only)
# {bug}                     — error traceback (raw or summarized)
# {filename}                — single filename (analyzer, debugger_summarize)
# {guidelines}              — output format instructions (finalyzer)
# {report}                  — current draft report (writer_refine, subquestion_generator_refine)
# {subquestion_answer_pairs} — formatted as:
#                               {Sub-Question #1}
#                               {Answer #1}
#                               ...
# {num_subquestions}        — integer count of sub-questions (writer_init only)
