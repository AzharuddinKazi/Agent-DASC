# Path-rewriting shim in front of self-hosted PostgREST.
#
# supabase-py hardcodes `<SUPABASE_URL>/rest/v1/...` (it's built to talk to Supabase's own
# Kong gateway, which is what adds that `/rest/v1` prefix in front of a real PostgREST that
# itself serves tables at the root). Plain `postgrest/postgrest` has no equivalent prefix
# option, so backend/.env's SUPABASE_URL points here instead of straight at the `postgrest`
# service — this just strips the prefix and forwards everything else unchanged. See
# TASKS.md "Supabase -> local Docker Postgres migration" for how this was discovered (live,
# via a 404 PGRST125 "Invalid path specified in request URL").
server {
    listen 3000;

    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}
