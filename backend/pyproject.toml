[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Every dependency has an upper bound now, not just a floor — a floor-only ">=" lets a
# fresh `uv sync --upgrade` (or any resolver re-run without the lockfile) silently pull a
# breaking major version with no signal here at all. Capped at the next major version for
# already-1.0+ packages, and at the next *minor* for pre-1.0 packages (fastapi, uvicorn,
# slowapi, python-multipart) since semver treats a 0.x minor bump as a potential breaking
# change, not a patch-level one.
dependencies = [
    "fastapi>=0.136.3,<0.137.0",
    "langgraph>=1.2.4,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=3.0.3,<4.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "pypdf>=6.1.3,<7.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "requests>=2.34.2,<3.0.0",
    "sentry-sdk[fastapi]>=2.66.1,<3.0.0",
    "supabase>=2.31.0,<3.0.0",
    "uvicorn>=0.49.0,<0.50.0",
    "slowapi>=0.1.10,<0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
]
