<!doctype html>
<!--
  DS-STAR Admin Panel — visual/behavioral reference, not production code.

  Standalone export of the mockup drafted and iterated in a Claude Code session
  (see TASKS.md "Planned — Google OAuth login + Admin Control Panel"). Plain HTML/CSS/JS,
  no build step, no framework — open directly in a browser. It reuses the app's real
  design tokens (frontend/src/index.css) and is grounded in the real codebase: the 12
  agents, their tiers and real prompt text (agents/*.py), the real Ollama model tags
  (llm_router.py's AGENT_TIERS / _AGENT_OVERRIDES), and the real data/ files.

  What's real vs. sample: agent names/tiers/prompts/models are copied from the actual
  backend source. KPI numbers, the activity feed, the recent-tasks table, the user list,
  and the domain-pack documents are illustrative sample data for the mockup — not live
  data (this file makes no network calls).

  Intent: a visual/interaction reference for whoever builds the real thing (React, wired
  to the actual API) — not a target to copy-paste into the app as-is.
-->
<html>
<head>
<meta charset="utf-8">
<title>DS-STAR Admin Panel — Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF8F5; --fg:#1D1A16;
  --card:#ffffff;
  --primary:#B01E23; --primary-fg:#ffffff;
  --muted-fg:#6B6459;
  --border:#E7E1D8;
  --brand:#B01E23; --brand-ink:#7A1418; --brand-tint:#F7E7E5; --brand-tint-2:#F0D4D2;
  --success:#1A7A4C; --success-bg:#EAF5EE;
  --warning:#B4650A; --warning-bg:#FBF0E1;
  --danger:#B0271E; --danger-bg:#FBEAE8;
  --info:#2563eb; --info-bg:#eff6ff;
  --n900:#2B261F; --n700:#504839; --n600:#6B6459; --n500:#877E70; --n400:#A69E8F; --n300:#C7BCA9; --n200:#E7E1D8; --n100:#F2ECE3;
  --radius:10px;
  --font-sans:'Manrope',system-ui,sans-serif;
  --font-mono:'Source Code Pro',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none} a:hover{color:var(--brand-ink)}
svg.ic{width:16px;height:16px;flex-shrink:0}
svg.ic *{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;text-align:left}

.shell{display:flex;width:100%;height:100vh;min-height:700px;overflow:hidden}
.sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
.brand-txt{line-height:1.15;min-width:0}
.brand-name{font-size:13.5px;font-weight:700;letter-spacing:-0.01em}
.brand-tag{font-size:10.5px;color:var(--muted-fg)}
.admin-chip{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.05em;background:var(--n900);color:#fff;padding:3px 7px;border-radius:20px}

.nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-group{margin-bottom:18px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--n400);padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--n700);margin-bottom:2px;cursor:pointer;width:100%}
.nav-item.active{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
.nav-item.disabled{opacity:.42;cursor:default}
.nav-item .count{margin-left:auto;font-size:10px;font-weight:700;color:var(--n400);background:var(--n100);padding:1px 6px;border-radius:10px}
.nav-item.active .count{background:var(--brand-tint-2);color:var(--brand-ink)}

.sidebar-foot{border-top:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--n900);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.who{flex:1;min-width:0}
.email{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:10.5px;color:var(--muted-fg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex-shrink:0;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;padding:0 24px;gap:16px}
.crumb{font-size:13px;color:var(--muted-fg)}
.crumb b{color:var(--fg);font-weight:700}
.searchbox{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--n100);border:1px solid var(--border);border-radius:8px;padding:6px 10px;width:230px;color:var(--n500);font-size:12.5px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--n600);position:relative}
.dot-badge{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}
.status-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--success);background:var(--success-bg);padding:5px 10px;border-radius:20px;flex-shrink:0}
.status-pill .d{width:6px;height:6px;border-radius:50%;background:var(--success)}

.content{flex:1;overflow-y:auto;padding:22px 28px}
.page-head{margin-bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin:0 0 3px}
.page-sub{font-size:12.5px;color:var(--muted-fg);margin:0;max-width:600px}
.page-actions{display:flex;gap:8px;flex-shrink:0}

.card{background:#fff;border-radius:var(--radius);box-shadow:0 0 0 1px rgba(29,26,22,.08)}

.kpi-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px 13px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.kpi-icon{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:13px;height:13px}
.kpi-value{font-size:21px;font-weight:800;letter-spacing:-0.02em;line-height:1}
.kpi-label{font-size:10.5px;color:var(--muted-fg);margin-top:3px;line-height:1.3}
.kpi-trend{font-size:9.5px;font-weight:700;display:flex;align-items:center;gap:2px}
.trend-up{color:var(--success)}
.trend-down{color:var(--danger)}
.trend-flat{color:var(--n500)}

.status-strip{display:flex;align-items:stretch;margin-bottom:12px;padding:0 4px}
.status-seg{flex:1;display:flex;align-items:center;gap:9px;padding:11px 16px}
.status-seg + .status-seg{border-left:1px solid var(--n100)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex-shrink:0;box-shadow:0 0 0 3px var(--success-bg)}
.status-name{font-size:11.5px;font-weight:700;line-height:1.25}
.status-meta{font-size:10.5px;color:var(--muted-fg);line-height:1.25}

.three-col{display:grid;grid-template-columns:1.2fr 1.1fr 0.72fr;gap:12px;align-items:start}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.section-title{font-size:12.5px;font-weight:700;margin:0}
.section-count{font-size:10.5px;color:var(--n400);font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn-outline{background:#fff;border-color:var(--border);color:var(--fg)}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{color:var(--muted-fg)}

.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:20px;font-size:10.5px;font-weight:700}
.b-success{background:var(--success-bg);color:var(--success)}
.b-warning{background:var(--warning-bg);color:var(--warning)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-neutral{background:var(--n100);color:var(--n600)}
.b-brand{background:var(--brand-tint);color:var(--brand-ink)}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--n400);padding:0 16px 7px;border-bottom:1px solid var(--border)}
td{padding:8px 16px;border-bottom:1px solid var(--n100);vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--font-mono);font-size:10.5px}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.activity-list{padding:4px 6px 10px}
.activity-row{display:flex;gap:9px;padding:6px 10px;border-radius:8px}
.activity-icon{width:22px;height:22px;border-radius:6px;background:var(--n100);color:var(--n600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-icon svg{width:12px;height:12px}
.activity-body{min-width:0}
.activity-text{font-size:11.5px;line-height:1.35}
.activity-text b{font-weight:700}
.activity-meta{font-size:10px;color:var(--muted-fg);margin-top:0}

.quick-actions{padding:4px 10px 12px;display:flex;flex-direction:column;gap:5px}
.qa-row{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;border:1px solid var(--border);cursor:pointer}
.qa-icon{width:24px;height:24px;border-radius:6px;background:var(--brand-tint);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qa-icon svg{width:12px;height:12px}
.qa-text{flex:1;min-width:0}
.qa-title{font-size:11.5px;font-weight:700}
.qa-sub{font-size:10px;color:var(--muted-fg)}

/* Prompts page */
.legend-row{display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:0 4px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-fg)}
.legend-dot{width:7px;height:7px;border-radius:50%}
.prompt-layout{display:grid;grid-template-columns:264px 1fr;gap:12px;height:calc(100vh - 56px - 56px - 44px - 88px)}
.agent-list{overflow-y:auto;padding:6px}
.agent-row{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:8px;margin-bottom:1px;cursor:pointer;width:100%}
.agent-row.active{background:var(--n900)}
.agent-row.active .agent-name{color:#fff}
.agent-row.active .agent-list-desc{color:var(--n300)}
.agent-tier-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.agent-text{flex:1;min-width:0}
.agent-name-row{display:flex;align-items:center;gap:6px}
.agent-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-list-desc{font-size:10.5px;color:var(--muted-fg);margin-top:1px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mod-dot{width:6px;height:6px;border-radius:50%;background:var(--warning);flex-shrink:0}
.editor-card{display:flex;flex-direction:column;min-width:0}
.editor-head{padding:14px 18px;border-bottom:1px solid var(--n100);display:flex;align-items:center;gap:9px;flex-shrink:0}
.editor-title{font-size:14.5px;font-weight:700}
.editor-meta{margin-left:auto;font-size:11px;color:var(--muted-fg)}
.editor-body{flex:1;overflow-y:auto;padding:16px 18px}
.prompt-box{background:var(--n900);color:#E9E4DB;border-radius:8px;padding:15px 17px;font-family:var(--font-mono);font-size:12px;line-height:1.65;white-space:pre-wrap}
.editor-foot{padding:12px 18px;border-top:1px solid var(--n100);display:flex;align-items:center;gap:10px;flex-shrink:0}
.hint{font-size:11px;color:var(--muted-fg);margin-right:auto}

/* Models page */
.summary-row{display:flex;gap:12px;margin-bottom:12px}
.summary-chip{flex:1;display:flex;align-items:center;gap:11px;padding:12px 15px}
.summary-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.summary-icon svg{width:14px;height:14px}
.summary-label{font-size:10.5px;color:var(--muted-fg)}
.summary-value{font-size:13.5px;font-weight:700;margin-top:1px}
.model-chip{display:inline-flex;align-items:center;gap:6px;background:var(--n900);color:#E9E4DB;padding:4px 9px;border-radius:7px;font-family:var(--font-mono);font-size:11px}
.chev{width:10px;height:10px;opacity:.55}
.agent-cell{font-weight:700;font-size:12.5px}
.agent-desc{font-size:10.5px;color:var(--muted-fg);margin-top:1px;font-weight:400}
.override-tag{font-size:10px;color:var(--brand-ink);font-weight:700}

/* Data page */
.tabs{display:flex;gap:4px;background:var(--n100);border-radius:9px;padding:3px;width:fit-content;margin-bottom:12px}
.tab{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted-fg);cursor:pointer}
.tab.active{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(29,26,22,.08)}
.dropzone{border:1.5px dashed var(--n300);border-radius:var(--radius);background:#fff;padding:20px 22px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.dz-icon{width:38px;height:38px;border-radius:10px;background:var(--brand-tint);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dz-icon svg{width:17px;height:17px}
.dz-title{font-size:13px;font-weight:700}
.dz-sub{font-size:11.5px;color:var(--muted-fg);margin-top:2px}
.file-cell{display:flex;align-items:center;gap:9px}
.file-icon{width:28px;height:28px;border-radius:7px;background:var(--n100);color:var(--n600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-icon svg{width:13px;height:13px}
.file-name{font-weight:700;font-size:12px}
.file-path{font-family:var(--font-mono);font-size:10px;color:var(--muted-fg);margin-top:1px}
.action-btn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--n500);cursor:pointer}
</style>
</head>

<script>
// ---------------------------------------------------------------------------------------
// Data — copied from the real backend (backend/agents/*.py, backend/llm_router.py). See
// the top-of-file comment for what's real vs. illustrative sample data.
// ---------------------------------------------------------------------------------------

const AGENT_DEFS = [
  { id: 'planner', name: 'Planner', tier: 'high', desc: 'Multi-step reasoning over query + file descriptions', runNote: 'Every round — proposes the next analysis step',
    prompt: `You are an expert data analyst.
In order to answer factoid questions based on the given data, you have to first plan effectively.
{hypothesis_section}{domain_knowledge}
# Question
{question}

# Given data:
{summaries}

# Your task
Suggest your very first step to answer the question above.
Your first step does not need to be sufficient to answer the question.
Just propose a very simple initial step, which can act as a good starting point.
Your response should only contain an initial step.` },

          <div class="editor-body"><div class="prompt-box">${esc(sel.prompt)}</div></div>
          <div class="editor-foot">
            <div class="hint">${sel.modified ? 'Edited by azharuddin@gmail.com · 6 minutes ago' : 'Using the built-in default — never edited'}</div>
            <div class="btn btn-ghost"><svg class="ic"><use href="#i-rotate"/></svg>Reset to default</div>
            <div class="btn btn-primary">Save changes</div>
          </div>
        </div>
      </div>`;
}

function renderModels() {
  const rows = MODEL_ROWS.map(r => {
    const def = AGENT_DEFS.find(a => a.id === r.id);
    const tm = TIER_META[def.tier];
    return `<tr>
      <td><div class="agent-cell">${esc(r.name)}</div><div class="agent-desc">${esc(r.desc)}</div></td>
      <td><span class="badge ${tm.badgeCls}">${tm.label}</span></td>
      <td><span class="model-chip">${esc(r.model)}<svg class="ic chev"><use href="#i-chevron-down"/></svg></span> ${r.override ? '<span class="override-tag">override</span>' : ''}</td>
      <td>${esc(r.runs)}</td>
    </tr>`;
  }).join('');

  return `
      <div class="page-head">
        <div>
          <p class="page-title">Model &amp; Tier Configuration</p>
          <p class="page-sub">Which model powers each agent, and at what quality tier. Backed by a local Ollama server.</p>
        </div>
        <div class="page-actions"><button class="btn btn-outline" data-nav="prompts"><svg class="ic"><use href="#i-terminal"/></svg>Edit prompts</button></div>
      </div>
      <div class="summary-row">
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--success-bg);color:var(--success)"><svg class="ic"><use href="#i-check-circle"/></svg></div><div><div class="summary-label">Ollama connection</div><div class="summary-value">Connected · localhost:11434</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--info-bg);color:var(--info)"><svg class="ic"><use href="#i-layers"/></svg></div><div><div class="summary-label">Speed profile</div><div class="summary-value">Free (local, no billing)</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--brand-tint);color:var(--brand-ink)"><svg class="ic"><use href="#i-cpu"/></svg></div><div><div class="summary-label">Loaded tags</div><div class="summary-value">4 · dsstar-high/medium/low/coder</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--n100);color:var(--n600)"><svg class="ic"><use href="#i-sliders"/></svg></div><div><div class="summary-label">Tier split</div><div class="summary-value">6 High · 5 Medium · 1 Low</div></div></div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Agent</th><th>Tier</th><th>Model</th><th>Runs</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
}

function renderData() {
  const rawRows = RAW_FILES.map(f => `<tr>
    <td><div class="file-cell"><div class="file-icon"><svg class="ic"><use href="#${f.icon}"/></svg></div><div><div class="file-name">${esc(f.name)}</div><div class="file-path">/workspace/data/${esc(f.name)}</div></div></div></td>
    <td class="mono">${esc(f.size)}</td>
    <td>Today, 11:38</td>
    <td><span class="badge ${f.statusCls}">${esc(f.status)}</span></td>
    <td><span class="action-btn"><svg class="ic"><use href="#i-eye"/></svg></span><span class="action-btn"><svg class="ic"><use href="#i-trash"/></svg></span></td>
  </tr>`).join('');

  const docRows = PACK_DOCS.map(d => `<tr>
    <td><div class="file-cell"><div class="file-icon"><svg class="ic"><use href="#i-file"/></svg></div><div><div class="file-name">${esc(d.name)}</div></div></div></td>
    <td class="mono">${esc(d.pack)}</td>
    <td class="mono">${esc(d.size)}</td>
    <td class="mono">${d.chunks}</td>
    <td><span class="badge ${d.statusCls}">${esc(d.status)}</span></td>
    <td><span class="action-btn"><svg class="ic"><use href="#i-eye"/></svg></span><span class="action-btn"><svg class="ic"><use href="#i-trash"/></svg></span></td>
  </tr>`).join('');

  return `
      <div class="page-head">
        <div>
          <p class="page-title">Data Manager</p>
          <p class="page-sub">Files available to the sandbox and the domain-pack knowledge base.</p>
        </div>
        <div class="btn btn-primary"><svg class="ic"><use href="#i-upload"/></svg>Upload file</div>
      </div>
      <div class="summary-row">
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--success-bg);color:var(--success)"><svg class="ic"><use href="#i-database"/></svg></div><div><div class="summary-label">Raw data files</div><div class="summary-value">5 files · 36 MB</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--brand-tint);color:var(--brand-ink)"><svg class="ic"><use href="#i-package"/></svg></div><div><div class="summary-label">Domain packs</div><div class="summary-value">3 active</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--info-bg);color:var(--info)"><svg class="ic"><use href="#i-file"/></svg></div><div><div class="summary-label">Pack documents</div><div class="summary-value">3 in fraud-aml</div></div></div>
        <div class="card summary-chip"><div class="summary-icon" style="background:var(--n100);color:var(--n600)"><svg class="ic"><use href="#i-clock"/></svg></div><div><div class="summary-label">Last upload</div><div class="summary-value">Today, 11:38</div></div></div>
      </div>
      <div class="tabs">
        <button class="tab${state.dataTab === 'raw' ? ' active' : ''}" data-tab="raw">Raw Data Files</button>
        <button class="tab${state.dataTab === 'docs' ? ' active' : ''}" data-tab="docs">Domain Pack Documents</button>
      </div>
      <div class="dropzone">
        <div class="dz-icon"><svg class="ic"><use href="#i-upload"/></svg></div>
        <div><div class="dz-title">Drag files here or browse</div><div class="dz-sub">CSV, XLSX, JSON, PDF, DOCX — mounted read-only into the sandbox at /workspace/data</div></div>
        <div class="btn btn-outline" style="margin-left:auto">Browse files</div>
      </div>
      ${state.dataTab === 'raw' ? `
      <div class="card"><table><thead><tr><th>File</th><th>Size</th><th>Modified</th><th>Status</th><th></th></tr></thead><tbody>${rawRows}</tbody></table></div>
      ` : `
      <div class="card"><table><thead><tr><th>Document</th><th>Pack</th><th>Size</th><th>Chunks</th><th>Status</th><th></th></tr></thead><tbody>${docRows}</tbody></table></div>
      `}`;
}

function renderContent() {
  if (state.page === 'prompts') return renderPrompts();
  if (state.page === 'models') return renderModels();
  if (state.page === 'data') return renderData();
  return renderDashboard();
}

function render() {
  document.getElementById('app').innerHTML = `
    <div class="shell">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        <div class="content">${renderContent()}</div>
      </div>
    </div>`;
}

document.getElementById('app').addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    const id = navBtn.dataset.nav;
    if (PAGES.has(id)) { state.page = id; render(); }
    return;
  }
  const agentBtn = e.target.closest('[data-agent]');
  if (agentBtn) { state.selectedAgent = agentBtn.dataset.agent; render(); return; }
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { state.dataTab = tabBtn.dataset.tab; render(); return; }
});

render();
</script>
</body>
</html>
